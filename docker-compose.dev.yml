services:
  mongo:
    image: mongo:7
    container_name: bimd-template-mongo
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: bimd_template
    volumes:
      - mongo-data:/data/db

  minio:
    image: minio/minio:latest
    container_name: bimd-template-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_REGION_NAME: us-east-1
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: bimd-template-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done;
      mc mb --ignore-existing local/bimd-template;
      mc anonymous set none local/bimd-template;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: bimd-template-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  mongo-data:
  minio-data:
